const SOURCES = [
{id:'wisdom',title:'The Wisdom of the Enneagram',author:'Don Richard Riso & Russ Hudson',year:'1999',loc:'Ch. 13, Type Seven; Ch. 14, Type Eight; “Challenges to Growth” in each chapter',files:'text/part0018_split_005.html · text/part0018_split_007.html · text/part0019_split_005.html · text/part0019_split_007.html',summary:'Seven is described as seeking satisfaction and avoiding deprivation or pain; Eight as protecting autonomy and resisting violation. The growth chapters discuss Seven’s wandering attention and Eight’s struggle for self-sufficiency. These are the authors’ model of motivation, not established facts about either person.'},
{id:'understanding',title:'Understanding the Enneagram',author:'Don Richard Riso & Russ Hudson',year:'Revised edition, 2000',loc:'“Recommendations for Personality Type Seven” and “Recommendations for Personality Type Eight”',files:'text/part0018_split_007.html · text/part0018_split_008.html',summary:'The Seven recommendations emphasize noticing impulses, choosing quality over quantity, listening, and staying with present experience. The Eight recommendations emphasize restraint, receiving affection, recognizing interdependence, and using strength generously. The Stay and autonomy exercises are original applications, not exercises reproduced from the book.'},
{id:'discovering',title:'Discovering Your Personality Type',author:'Don Richard Riso & Russ Hudson',year:'Copyright 2003 in supplied EPUB',loc:'Ch. 5, How the System Works; Ch. 12, Type Seven; Ch. 13, Type Eight; Ch. 15, Interpretation: Getting More out of the RHETI',files:'OPS/c05.xhtml · OPS/c12.xhtml · OPS/c13.xhtml · OPS/c15.xhtml',summary:'The authors describe nine psychological functions and interpret a whole score pattern in addition to a leading type. Their scoring guidance is specifically about the RHETI; we do not assume these screenshots came from that instrument. The “internal committee” is a playful adaptation. Wings are adjacent types; secondary scores do not establish wings, instincts, or a level of development.'},
{id:'love',title:'The Enneagram in Love',author:'Stephanie Barron Hall',year:'2020',loc:'“The Wing”; “Seven: The Enthusiast”; “Eight: The Challenger”; The Interplay, “7–8”',files:'text/part0012.html · text/part0024.html · text/part0025.html · text/part0069.html',summary:'Hall describes 7–8 as an energetic pairing with potential tension around emotional engagement: Seven may keep things positive while Eight wants to address difficulty. She recommends slowing down, noticing reactions, and communicating. This complicates the prior personalized pursuit/withdrawal hypothesis; it does not confirm that hypothesis. Pairing descriptions are possibilities, not compatibility scores.'},
{id:'intimacy',title:'The Enneagram, Relationships, and Intimacy',author:'David Daniels & Suzanne Dion; foreword by Daniel J. Siegel',year:'2018; supplied EPUB notes updated edition Fall 2022',loc:'Ch. 13, Insights and Suggestions: Let’s Consciously Impact our Intimacy',files:'OEBPS/part0027.xhtml',summary:'This chapter centers self-connection, an individuated self, presence, and open, caring communication in shared intimacy. It emphasizes how people show up with one another, rather than a supposedly ideal type pairing. Our prompts invite each person to name preferences and boundaries; no desire, touch preference, or attachment style is inferred from type.'},
{id:'complete',title:'The Complete Guide to the Enneagram',author:'Sierra Mackenzie',year:'2022',loc:'Type Seven and Type Eight chapters, including “In Love” and “At Work”',files:'OEBPS/c07.xhtml · OEBPS/c08.xhtml',summary:'Mackenzie describes Seven’s appetite for possibility and the importance of noticing feelings beneath activity, and Eight’s self-sufficiency and challenge of opening to trust. Her life-domain approach informs the work/love/stress organization here. Broad or absolute claims in the book have not been turned into personal facts.'}
];
const TYPES={
1:['The Reformer','Let’s do this properly.','Discernment, integrity, responsibility.','Standards harden into criticism.','What is good enough for this situation?'],
2:['The Caretaker','I can help.','Generosity, attunement, involvement.','Helping becomes over-functioning.','Was this help requested, and do I have capacity?'],
3:['The Achiever','Let’s make it work.','Adaptability, momentum, effectiveness.','Output becomes a measure of worth.','What would matter without recognition?'],
4:['The Individualist','It needs to mean something.','Authenticity, depth, personal expression.','The imperfect real thing loses to an ideal.','Can something ordinary still be meaningful?'],
5:['The Investigator','I need to understand it.','Analysis, expertise, independent thought.','Research replaces participation.','What information would actually change the next step?'],
6:['The Loyalist','Have we checked the risks?','Preparation, questioning, commitment.','Checking becomes an endless search for certainty.','What is a proportionate precaution?'],
7:['The Explorer','Wait. I have an idea.','Curiosity, possibility, resilience, synthesis.','More options crowd out presence and completion.','Am I moving toward something or away from a feeling?'],
8:['The Challenger','I’ll handle it.','Agency, courage, protection, directness.','Self-reliance becomes control or isolation.','Can I keep my agency while letting someone in?'],
9:['The Peacemaker','Let’s find some common ground.','Receptivity, steadiness, mediation.','Keeping the peace obscures a real preference.','What do I want to say clearly?']
};
const PEOPLE={
susanna:{name:'Susanna',core:7,title:'The Possibility Architect',tag:'Curiosity, connection, and the courage to ask what else is possible.',lead:'Possibility, with a purpose.',intro:'Your earlier analysis described a curious, high-agency, people-oriented systems thinker: someone who connects ideas, mobilizes around problems, and wants discoveries to help actual people. Treat that as a promising portrait to test—not a role you have to perform.',prompt:'What deserves your attention now?',order:[7,2,8,4,3,5,1,9,6],strength:{7:'Dominant',2:'Prominent',8:'Prominent',4:'Meaningful',3:'Meaningful',5:'Meaningful',1:'Moderate',9:'Moderate',6:'Lowest'},tool:'Stay tool',toolId:'stay',summary:'7 leads; 2 and 8 stand out; 4, 3, and 5 add texture. The prior report records Caretaking as 19/20. All type rankings are qualitative readings from the earlier chart analysis, not recovered numerical scores.'},
greg:{name:'Greg',core:8,title:'The Sovereign Investigator',tag:'Autonomy, understanding, and the strength to choose your own course.',lead:'Strength, with substance.',intro:'Your earlier analysis centered sovereignty: enough freedom, knowledge, competence, and personal authority to navigate life on your own terms. The interesting combination is Eight’s agency, Five’s depth, and One’s standards—not a caricature of dominance.',prompt:'What do you need room for?',order:[8,5,1,7,6,4,3,9,2],strength:{8:'Dominant',5:'Very high',1:'High',7:'Moderate–high',6:'Moderate',4:'Moderate',3:'Moderate–low',9:'Moderate–low',2:'Lowest'},tool:'Autonomy check',toolId:'autonomy',summary:'8 leads, followed by 5 and 1; 7 is also prominent. These are approximate relative strengths from the prior chart reading. A low Two score does not measure empathy, affection, or capacity to care.'}
};
// Every personalized paragraph remains an inference until the named person responds.
const REPORTS={
susanna:[
['possibility','Core pattern','Expanding the option set','When something isn’t working, your mind may ask what else is possible. Novelty can be informational: a new question, a system to map, a connection between fields. Curiosity is not limited to travel, parties, or thrill-seeking.','What kind of discovery reliably gives you energy?','wisdom'],
['care','Superpowers','Curiosity that becomes useful','The earlier Caretaking result, recorded as 19/20, adds context to the prominent Two pattern. You may turn “I learned something” into a resource, explanation, community, or tool someone else can use. The exact score is assessment context, not proof that every helping hypothesis fits.','When has helping felt energizing rather than obligatory?','discovering'],
['agency','Superpowers','There must be another way. Then let’s do it.','Seven’s possibility and your prominent Eight result suggest resourcefulness plus action. Ambiguity may invite you to take ownership. The gift is momentum; the cost can be velocity outrunning priorities. Being capable of doing something does not make it yours to do.','What responsibility could you choose not to acquire?','discovering'],
['meaning','Superpowers','Human, meaningful, and effective','The earlier Four and Three readings suggest that useful alone may not be enough: you may want the work to feel personally meaningful, beautifully expressed, and capable of producing results. Those are hypotheses about preferences, not additional core types.','Where do meaning and effectiveness reinforce each other?','discovering'],
['research','How I work','Information itself can be an adventure','Your Five pattern may add depth to Seven’s breadth. Research, talent intelligence, sourcing, emerging technology, systems, and knowledge-sharing were examples in the earlier report—not conclusions about which career you must have. Watch for learning that helps a decision versus learning that postpones one.','What fact would be enough to act?','complete'],
['uncertainty','Blind spots','Turning uncertainty into exploration','Your low Six reading does not mean you lack anxiety or loyalty. The earlier hypothesis was that possibility may come more readily than contingency planning. A small, deliberate risk check can protect your creative work without requiring certainty.','What boring failure mode deserves five minutes of preparation?','discovering'],
['work','How I work','Ambiguity + people + information + invention','You may thrive when you can understand a messy problem, see patterns, build something better, and bring people along. Autonomy, variety, complexity, human impact, and ownership may matter more than a tidy job description. Test those needs against actual experience.','Which conditions were present during your best recent workday?','complete'],
['leadership','How I work','Momentum through possibility','The prior analysis pictured a leader who helps people see an opportunity inside change: enthusiasm with backbone, investment in people, and a desire for results. The practice is to check whether others share your bandwidth and have a clear next step.','Have I translated excitement into a realistic commitment?','discovering'],
['maintenance','Blind spots','Every brilliant system gets a Tuesday','Discovery can be more stimulating than maintenance. Repetition, needless bureaucracy, micromanagement, and problems you are forbidden to improve may drain you. But essential upkeep is not evidence that the original project was wrong.','What is the smallest sustainable maintenance routine?','understanding'],
['overcommit','Blind spots','Interesting is not the same as important','Seven sees everything that could be done; Two sees everyone who could be helped; Eight offers to handle it. Your bottleneck may be opportunity abundance. Ask whether it matters, whether it matters now, what it displaces, and whether you want the outcome or just the discovery phase.','Will I still want this when it becomes boring?','understanding'],
['overwhelmed','Under stress','More cognitive activity','Research → options → planning → organizing → solving may create temporary relief when you feel overwhelmed. This is a personalized loop, not a diagnosis. Sometimes the useful move is fewer inputs, one body-level observation, and one next action.','Am I processing a feeling or building a project around it?','wisdom'],
['hurt','How I love','A feeling does not have to become productive','Explaining, reframing, and solving can help—and can sometimes route around hurt. Your growth edge may be allowing disappointment or uncertainty to exist without immediately improving it. You can ask for company before explanations.','What is the simplest honest sentence about how this feels?','understanding'],
['love','How I love','Care that gets involved','Playfulness, shared experiences, curiosity, emotional engagement, meaningful gestures, and practical involvement were recurring themes in the earlier report. Reciprocity may matter: feeling actively chosen and seeing care come back, even in a different form.','What specific action makes care visible to me?','complete'],
['helping','How I love','An entire consulting firm arrives','Two wants to help, Seven finds options, Five researches, and Eight acts. That playful committee can leave you carrying someone else’s situation. Ask whether they want support, ideas, action, or presence before doing all four.','What support was actually invited?','discovering'],
['boundaries','Growth','Generosity needs a boundary','The earlier report’s caregiving theme suggests your next move may not be “care more.” It may be making offers with limits, naming your own needs, and letting other people keep responsibility for their decisions.','What can I offer freely without creating resentment?','understanding'],
['stay','Growth','Stay—or leave intentionally','Staying is a practice of choosing attention, not a rule to endure every situation. Distinguish fading novelty from a project that no longer serves you. Choose a small finished-enough action or write an honest reason to stop.','What would a deliberate choice look like here?','understanding'],

function wheel(p){let points={};for(let n=1;n<=9;n++){const a=((n%9)*40-90)*Math.PI/180;points[n]=[50+40*Math.cos(a),50+40*Math.sin(a)];}const paths=[[1,4,2,8,5,7,1],[9,3,6,9]].map(ns=>`<polyline points="${ns.map(n=>points[n].join(',')).join(' ')}"/>`).join('');return `<div class="wheel-wrap"><div class="wheel" role="group" aria-label="Explore nine type patterns; positions do not represent scores"><svg aria-hidden="true" viewBox="0 0 100 100"><g fill="none" stroke="currentColor" stroke-width=".35"><circle cx="50" cy="50" r="40"/>${paths}</g></svg>${Object.entries(points).map(([n,[x,y]])=>`<button style="left:${x}%;top:${y}%" data-type="${n}" aria-pressed="${+n===selectedType}" aria-label="Type ${n}, ${TYPES[n][0]}, ${p.strength[n]}">${n}</button>`).join('')}<div class="center"><b>${selectedType}</b><span>${esc(TYPES[selectedType][0])}<br>${esc(p.strength[selectedType])}</span></div></div></div>`;}
function overview(p){return `<div class="hero"><div><p class="person-line">${p.name} · Core pattern ${p.core}</p><h1>${p.title}</h1><p class="subtitle">${p.tag}</p></div>${wheel(p)}</div><section class="split band"><div><h2>${p.lead}</h2><span class="evidence">Personalized inference</span><p>${p.intro}</p></div><div class="callout"><p class="eyebrow">Try this today</p><h2>${p.prompt}</h2><p>A small step toward understanding what you need and choosing what comes next.</p>${link('Explore a pattern',route.person,'patterns',true)}</div></section><section class="band"><h2>A map, not a verdict.</h2><p class="muted">The framework starts the conversation. Your lived experience gets the final say.</p><div class="evidence-grid"><article><h3>Source-backed theory</h3><p>What the six books actually teach. Attribution is evidence of a source, not scientific proof.</p><a href="#library/theory">Explore the framework</a></article><article><h3>Personalized inference</h3><p>The earlier analyses, refined into hypotheses you can confirm, qualify, or reject.</p><a href="#${route.person}/report">See your patterns</a></article><article><h3>Your observations</h3><p>What you write and confirm yourself. Nothing starts out marked as personally verified.</p><a href="#${route.person}/manual">Write your user manual</a></article></div></section><section class="band split"><div><h2>Your chart, honestly.</h2><p>${p.summary}</p><p class="small muted">The circle is navigation, not a quantitative chart. Click any number to explore its theme. Wings and instincts remain open questions.</p><ul class="facts">${p.order.map(n=>`<li><button data-type="${n}">${n} · ${TYPES[n][0]}</button><span>${p.strength[n]}</span></li>`).join('')}</ul></div><div id="type-detail"><span class="evidence">Framework-inspired reflection · not a score interpretation</span><h3>${selectedType} · ${TYPES[selectedType][0]}</h3><p class="quote">“${TYPES[selectedType][1]}”</p><p><strong>Possible gift:</strong> ${TYPES[selectedType][2]}</p><p><strong>When overused:</strong> ${TYPES[selectedType][3]}</p><p class="prompt">${TYPES[selectedType][4]}</p>${src('discovering')}<div class="flowlinks">${link('Meet your committee',route.person,'committee')}</div></div></section>`;}
function individual(){const p=PEOPLE[route.person],who=route.person;switch(route.page){
case 'overview':return overview(p);
case 'committee':return heading('Meet your internal committee','A playful vocabulary for noticing a strategy—not nine people inside you, and not a set of proven traits.')+`<p class="small muted">Adapted from the nine-functions perspective in ${src('discovering')}. The voices and prompts are original. Your chart’s relative ordering sets the display order.</p><div id="driver-status" class="status-box">${val(who+'.driver')?'You last noticed Type '+esc(val(who+'.driver'))+' taking the lead.':'Who’s driving right now? Choose the voice you recognize today.'}</div><div class="committee">${p.order.map(n=>`<article class="voice"><b class="number">${n}</b><h3>${TYPES[n][0]}</h3><p class="quote">“${TYPES[n][1]}”</p><p><strong>Gives:</strong> ${TYPES[n][2]}</p><p><strong>Hijacks:</strong> ${TYPES[n][3]}</p><p>${TYPES[n][4]}</p><button data-driver="${n}" aria-pressed="${val(who+'.driver')===String(n)}">This is driving today</button></article>`).join('')}</div>`+field(who+'.committee-note','What happened, and what would help another voice get a turn?');
case 'report':{const filter=val(who+'.report-filter')||'All';const cats=['All',...new Set(REPORTS[who].map(r=>r[1]))];return heading('How '+p.name+' works','The substantive portrait from your earlier analysis, organized for reflection and revised where the books call for nuance.')+`<p class="notice">Core type is a working interpretation. Secondary patterns are themes, not separate diagnoses or settled wings. A response changes its evidence label; “Nope” keeps it out of confirmed summaries. Your answer never makes a general theory scientifically proven.</p><div class="chips" role="group" aria-label="Report category">${cats.map(c=>`<button data-filter="${esc(c)}" aria-pressed="${filter===c}">${esc(c)}</button>`).join('')}</div>${REPORTS[who].filter(r=>filter==='All'||r[1]===filter).map(r=>insight(who,r)).join('')}`;}
case 'patterns':{const r=PATTERNS[who][selectedPattern];return heading('What’s happening right now?','Start with the moment, not the label. Try a small experiment and notice what actually helps.')+`<label for="pattern">Choose a situation</label><select id="pattern">${PATTERNS[who].map((r,i)=>`<option value="${i}" ${i===selectedPattern?'selected':''}>${r[0]}</option>`).join('')}</select><section class="selection"><span class="evidence">Personalized hypothesis · suggested experiment</span><h2>${r[0]}</h2><div class="steps"><div class="step"><h3>Possible pattern</h3><p>${r[1]}</p></div><div class="step"><h3>A need to check</h3><p>${r[2]}</p></div><div class="step"><h3>A useful question</h3><p>${r[3]}</p></div><div class="step"><h3>One possible next move</h3><p>${r[4]}</p></div></div>${src(who==='susanna'?'understanding':'wisdom')}<div data-feedback="${who}.pattern-${selectedPattern}">${evidence(who,'pattern-'+selectedPattern)}${feedback(who,'pattern-'+selectedPattern)}</div>${field(who+'.pattern-observation.'+selectedPattern,'What actually happened? What helped?')}<div class="toolbar">${btn('Save to my observations','save-pattern','','true')}${link(p.tool,who,p.toolId)}</div></section>`;}
case 'stay':return heading('Stay. Or leave intentionally.','Keep your freedom—and make the choice consciously.')+`<span class="evidence">Original practice inspired by the source · not a prescribed treatment</span>${src('understanding')}<div class="two-cols"><div>${select('susanna.stay-kind','What are you tempted to leave?',['A project','A feeling','A decision','A difficult conversation','Boredom','Uncertainty'],'A project')}${field('susanna.stay-context','What is happening?','Name the project, feeling, or moment.')}</div><div class="callout"><h3>Pause before the next door.</h3><div id="stay-questions">${stayQuestions()}</div><p class="small">Staying is not a duty to remain in harm or ignore your limits. An intentional exit is a valid outcome.</p></div></div>${field('susanna.stay-need','What matters here, and what would “finished enough” mean?')}${select('susanna.stay-choice','My choice',['Stay for one small step','Leave intentionally','Pause and revisit'],'Stay for one small step')}${field('susanna.stay-action','My next action—or my reason for leaving')}${field('susanna.stay-return','When will I revisit this?','A specific time or date','text')}<div class="toolbar">${btn('Save my choice','save-stay','',true)}</div>${logs('susanna','Stay choice')}`;
case 'autonomy':return heading('Autonomy or withdrawal?','You can protect your space and keep a line of connection open.')+`<span class="evidence">Original reflection tool · it does not classify your behavior</span>${src('understanding')}<div class="two-cols"><div>${field('greg.auto-trigger','What happened—without guessing their motive?')}${select('greg.auto-need','What do I most need?',['Time','Information','Choice','Rest','An actual boundary'],'Time')}${field('greg.auto-boundary','What boundary would meet that need?')}</div><div class="callout"><h3>Three questions before disappearing.</h3><p>Is there a specific limit I can communicate?</p><p>Am I taking space to return more present, or hoping the issue vanishes?</p><p>What can I share now without giving more access than I choose?</p><p class="small">A boundary does not require a promise you cannot keep. Say when you can check in, even if you are not ready to resolve everything.</p></div></div>${field('greg.auto-connection','What can I honestly say to preserve connection?')}${field('greg.auto-return','When can I check back?','For example: tonight at 7','text')}<div class="toolbar">${btn('Build my boundary statement','autonomy-statement','',true)}${btn('Save this reflection','save-autonomy')}</div><div id="autonomy-result" aria-live="polite"></div>${logs('greg','Autonomy check')}`;
case 'manual':return heading('How to '+p.name,'Written by you. The framework can suggest questions; it cannot supply your answers.')+`<p class="notice">Write only as ${p.name}. These entries are labeled self-reported, and appear in Us → Our user manuals and relevant relationship tools. They stay in this browser unless you export them. Blank fields remain unknown.</p><div class="two-cols">${MANUAL.map(([k,l])=>`<div class="manual-item">${field(who+'.manual.'+k,l)}</div>`).join('')}</div><div class="toolbar">${btn('Download my manual','export-manual','',true)}${link('See our manuals together','us','manuals')}</div>`;
case 'confirmed':return confirmed(who);
}}
function stayQuestions(){const k=val('susanna.stay-kind')||'A project';const q={'A project':['Has the project become wrong, or merely less novel?','What would one finished-enough action look like?'],'A feeling':['Can I name this feeling without fixing it?','What would a tolerable moment of presence look like?'],'A decision':['What criterion matters most now?','Could a reversible choice teach me more than another option?'],'A difficult conversation':['Is a pause needed for capacity, or am I avoiding the subject?','What is one honest sentence I could offer?'],'Boredom':['Is this activity meaningful even when it is unstimulating?','Could I finish one small piece before switching?'],'Uncertainty':['What is knowable right now?','What could I do without resolving the whole future?']}[k]||[];return q.map(s=>`<p>${s}</p>`).join('');}
function patternResponses(who){return PATTERNS[who].map((p,i)=>{const r=state.ratings[`${who}.pattern-${i}.${who}`];return r?`<article class="insight">${evidence(who,'pattern-'+i)}<h3>${esc(p[0])}</h3><p>${esc(p[1])}</p><p class="manual-answer">${esc(val(who+'.pattern-observation.'+i))}</p>${feedback(who,'pattern-'+i)}</article>`:''}).join('')||'<p class="muted">No pattern explorer responses yet.</p>';}
function confirmed(who){const yes=REPORTS[who].filter(r=>state.ratings[`${who}.${r[0]}.${who}`]==='yes'),sometimes=REPORTS[who].filter(r=>state.ratings[`${who}.${r[0]}.${who}`]==='sometimes'),no=REPORTS[who].filter(r=>state.ratings[`${who}.${r[0]}.${who}`]==='no');return heading('What '+PEOPLE[who].name+' has confirmed','A living record of self-reported patterns. You can change your mind.')+`<p class="progress">Report responses: ${yes.length} yes · ${sometimes.length} sometimes · ${no.length} nope</p>${yes.length?yes.map(r=>insight(who,r)).join(''):'<p class="empty">Nothing is confirmed yet. Explore your report and keep what fits.</p>'}<details><summary>Sometimes (${sometimes.length})</summary>${sometimes.map(r=>insight(who,r)).join('')||'<p>No qualified responses yet.</p>'}</details><details><summary>Rejected hypotheses (${no.length})</summary><p class="small muted">Kept here so you can review them; excluded from confirmed summaries.</p>${no.map(r=>insight(who,r)).join('')||'<p>No rejections yet.</p>'}</details><h2 class="band">Pattern explorer responses</h2>${patternResponses(who)}<h2 class="band">My observed moments</h2>${logs(who)}<h2 class="band">Add an observation</h2>${field(who+'.new-observation','What do you know from experience?')}<div class="toolbar">${btn('Save observation','save-observation','',true)}</div>`;}
function manualSnippet(who,key){const v=val(who+'.manual.'+key);return v?`<div class="status-box"><span class="evidence confirmed">${PEOPLE[who].name} wrote · self-reported</span><p class="manual-answer">${esc(v)}</p></div>`:`<p class="small muted">${PEOPLE[who].name} hasn’t written this preference yet. Ask rather than assume.</p>`;}
function confirmedSummary(){return ['susanna','greg'].map(w=>{const rs=REPORTS[w].filter(r=>state.ratings[`${w}.${r[0]}.${w}`]==='yes');return `<div><h3>${PEOPLE[w].name} says</h3>${rs.length?rs.map(r=>`<p><span class="evidence confirmed">Confirmed in the individual report</span><a href="#${w}/report">${esc(r[2])}</a></p>`).join(''):'<p class="muted">No individual report patterns confirmed yet.</p>'}${manualSnippet(w,'upset')}</div>`}).join('');}
const LOOP=['Something feels uncertain','Susanna seeks connection or information','Greg experiences pressure','Greg reduces contact or input','Susanna reads more uncertainty','Both intensify their protection'];
const LOOPDETAIL=[['Intent: find out what happened.','Possible impact: assumptions rush in before facts.','Ask: What did we observe, and what are we guessing?'],['Intent: restore continuity and understanding.','Possible impact: repeated questions feel like pressure.','Ask for one piece of reassurance and a return time.'],['Intent: protect processing space or choice.','Possible impact: the other person feels excluded.','Name the limit without assigning a bad motive.'],['Intent: lower input and regain capacity.','Possible impact: unexplained silence amplifies uncertainty.','Offer a short honest update and a check-in time.'],['Intent: find enough information to feel connected.','Possible impact: more pursuit increases the need for distance.','Check the agreed return point; notice what is known already.'],['Intent: protect something important.','Possible impact: the topic becomes a control contest.','Stop the contest. State a feeling, a need, and a manageable next step.']];
function us(){switch(route.page){
case 'overview':return heading('The Explorer × The Fortress','Two fiercely independent people. Two different ways of creating safety.')+`<span class="evidence">A metaphor from your earlier relationship analysis · not a fixed identity</span><div class="split band"><div><h2>Freedom. Intensity.<br>Curiosity. Loyalty.</h2><p>The original relationship portrait centered expansion and containment: Susanna may widen the map; Greg may investigate its depth. Both may value a partner with a mind and will of their own.</p><p>The promise is breadth plus depth, play plus substance, care plus agency. The challenge is to make closeness compatible with separateness—and to check whether these descriptions fit you at all.</p>${src('love')}</div><div class="callout"><h3>What do we need today?</h3><div class="flowlinks">${link('We’re in a tense moment','us','conflict',true)}${link('I want to understand','us','translate')}${link('We’re good—let’s connect','us','discovery')}</div><p class="small">These are guided prompts, not mind-reading or live counseling.</p></div></div><div class="band"><h2>Actual Susanna. Actual Greg.</h2><p>Your confirmed individual insights and written preferences appear here. A rejected hypothesis never becomes a shared fact.</p><div class="two-cols">${confirmedSummary()}</div></div><div class="band"><h2>Both versions deserve room.</h2><p>The earlier report suggested Susanna may move closer while Greg seeks space. Hall’s 7–8 chapter also describes Seven avoiding painful emotion while Eight wants to confront it. Either, both, or neither may happen. Ask about the present moment instead of assigning permanent roles.</p>${link('Explore our possible loops','us','loop')}</div>`;
case 'compare':{const d=COMPARE[selectedCompare],key=selectedCompare.replace(/[^a-zA-Z]/g,'').toLowerCase();const manualKey={Space:'space',Conflict:'disagree',Affection:'loved',Helping:'help',Stress:'stress',Communication:'upset',Trust:'safe',Intimacy:'touch',Vulnerability:'safe',Freedom:'controlled'}[selectedCompare];return heading('Same value. Different meanings.','Compare a dimension, then check it against what each of you says.')+`<label for="compare">Explore a dimension</label><select id="compare">${Object.keys(COMPARE).map(k=>`<option ${selectedCompare===k?'selected':''}>${k}</option>`).join('')}</select><article class="selection">${evidence('us','compare-'+key)}<h2>${esc(selectedCompare)}</h2><div class="two-cols"><div><p class="compare-head">Susanna · possible pattern</p><p class="lede">${d[0]}</p>${manualKey?manualSnippet('susanna',manualKey):''}</div><div><p class="compare-head">Greg · possible pattern</p><p class="lede">${d[1]}</p>${manualKey?manualSnippet('greg',manualKey):''}</div></div><div class="split band"><div><h3>Potential collision</h3><p>${d[2]}</p></div><div class="callout"><h3>A bridge to try</h3><p>${d[3]}</p></div></div><p class="small muted">Adapted from the earlier personalized relationship report. General context: ${src(selectedCompare==='Intimacy'?'intimacy':'love')}</p><div data-feedback="us.compare-${key}">${feedback('us','compare-'+key)}</div>${field('us.compare-note.'+key,'What is actually true for us?')}</article>`;}
case 'translate':{const w=val('us.translate-who')||'Greg',who=w.toLowerCase(),i=Math.min(Number(val('us.translate-index')||0),TRANSLATIONS[who].length-1),d=TRANSLATIONS[who][i];return heading('Translate my partner','Possible explanations—not a verdict about someone else’s inner world.')+`<div class="two-cols"><div>${select('us.translate-who','Who are you trying to understand?',['Greg','Susanna'],'Greg')}<label for="translation">What did you notice?</label><select id="translation">${TRANSLATIONS[who].map((d,n)=>`<option value="${n}" ${i===n?'selected':''}>${d[0]}</option>`).join('')}</select></div><div class="callout"><h3>Ask before concluding.</h3><p>Type cannot tell you why a particular person did something. Tiredness, circumstance, misunderstanding, or a different need can look like a “pattern.”</p></div></div><div class="band"><span class="evidence">Personalized possibilities</span><h2>What it might mean</h2><p>${d[1]}</p><h3>One question or request to try</h3><p class="prompt">${d[2]}</p><h3>What ${w} has actually written</h3>${manualSnippet(who,d[3])}${field('us.translation-observation','What did they say it meant?')}<div class="toolbar">${btn('Save what we learned','save-translation','',true)}</div></div>`;}
case 'loop':return heading('Notice the loop. Change one move.','This is the prior report’s hypothesis. Either person can seek closeness or need space.')+`<div data-feedback="us.loop">${evidence('us','loop')}${feedback('us','loop')}</div><div class="loop" role="group" aria-label="Possible conflict loop stages">${LOOP.map((t,i)=>`<button data-loop="${i}" aria-pressed="${i===selectedLoop}"><span>0${i+1}</span>${t}</button>`).join('')}</div><div class="callout" id="loop-detail"><h3>${LOOP[selectedLoop]}</h3><p>${LOOPDETAIL[selectedLoop][0]}</p><p>${LOOPDETAIL[selectedLoop][1]}</p><p class="prompt">${LOOPDETAIL[selectedLoop][2]}</p>${link('Break the loop here','us','conflict',true)}</div><section class="band"><h2>Another loop to watch for</h2><p><strong>Hard feeling → lightening or reframing → feeling dismissed → more intensity → more escape.</strong></p><span class="evidence">Source-backed theory · Hall’s 7–8 pairing</span><p>Hall describes a Seven wanting to stay positive while an Eight wants to address the difficult emotion. This is different from the prior personalized loop. Neither is a prediction about you.</p>${src('love')}<div data-feedback="us.alternate-loop">${feedback('us','alternate-loop')}</div></section>${field('us.loop-observation','Our actual loop—and where we can interrupt it')}`;
case 'conflict':return heading('Lower the heat. Keep the connection.','A short repair sequence for a difficult moment, with room for both voices.')+`<p class="notice">Use this only if both of you are willing and feel safe. A type label never excuses intimidation or overrides a boundary. No forced disclosure or immediate resolution is required.</p><div class="steps"><section class="step"><h2>Name the state</h2><p>Describe one event and its effect. Lead with the feeling, not an evidence archive.</p><div class="two-cols">${field('us.conflict-s','Susanna: I feel… because I noticed…')}${field('us.conflict-g','Greg: I feel… because I noticed…')}</div></section><section class="step"><h2>Name the need</h2><p>Understanding, reassurance, a decision, accountability, information, or space?</p><div class="two-cols">${field('us.conflict-sneed','Susanna: what I’m asking for…')}${field('us.conflict-gneed','Greg: what I’m asking for…')}</div></section><section class="step"><h2>Preserve continuity</h2><p>Space gets a return point. Promise only what you can honestly offer.</p>${field('us.conflict-reassurance','What can we honestly reassure each other about?')}${field('us.conflict-return','When and how will we check back?','For example: 7 p.m. at the kitchen table','text')}</section><section class="step"><h2>Choose one repair</h2><p>Reflect what you heard before proposing a solution. Each person owns the impact of their actions.</p>${field('us.conflict-next','Our next small action or agreement')}</section></div><div class="toolbar">${btn('Build our repair note','repair-note','',true)}${btn('Save repair agreement','save-conflict')}</div><div id="repair-result" aria-live="polite"></div>${src('intimacy','Communication foundation')}${logs('us','Repair agreement')}`;
case 'help':return heading('What kind of help?','An invitation prevents good intentions from turning into unwanted management.')+`<div class="two-cols"><div>${select('us.help-who','Who is asking for support?',['Susanna','Greg'],'Susanna')}${select('us.help-kind','What would feel useful right now?',['Listen without fixing','Offer reassurance','Help me brainstorm','Take a specific practical action','Keep me company','Give me space','Ask me what I need'],'Listen without fixing')}${field('us.help-specific','The specific request and any limits')}${field('us.help-time','When or for how long?','For example: ten minutes','text')}<div class="toolbar">${btn('Build my request','help-request','',true)}${btn('Save request','save-help')}</div></div><div><h3>The receiver’s words come first</h3>${manualSnippet((val('us.help-who')||'Susanna').toLowerCase(),'help')}<p class="small muted">The person offering help can say what they have capacity for. Neither person has to accept every offered role.</p></div></div><div id="help-result" aria-live="polite"></div>`;
case 'decision':return heading('Open the map. Then choose a path.','Separate discovery from evaluation. Either person can take either role.')+`<div class="steps"><div class="step"><h3>Agree on the question</h3>${field('us.decision-topic','What are we deciding?')}${field('us.decision-criteria','What matters to both of us?','Name the criteria before defending an option.')}${field('us.decision-owner','Who owns the decision—and when do we need it?','Both / one person, with a date','text')}</div><div class="step"><h3>Expand, without debating yet</h3>${field('us.decision-options','Our options','One option per line. Include “not now” if it is a real option.')}</div><div class="step"><h3>Stress-test the shortlist</h3>${field('us.decision-risks','What holds up? What are the costs, unknowns, and risks?')}${field('us.decision-missing','What information would actually change the choice?')}</div><div class="step"><h3>Choose an experiment or commitment</h3>${field('us.decision-choice','Our choice and why it serves the shared criteria')}${field('us.decision-next','Who does what next?')}${field('us.decision-review','When will we review?','A specific date or event','text')}</div></div><div class="toolbar">${btn('Save our decision','save-decision','',true)}</div>${logs('us','Decision')}`;
case 'weather':return heading('Our relationship weather','A check-in, not a compatibility score. A hard day does not define the relationship.')+`<div class="two-cols">${['susanna','greg'].map(w=>`<section><h2>${PEOPLE[w].name}</h2>${select('us.weather-'+w,'My weather today',['Not entered','Clear','Mixed','Cloudy','Stormy','Quiet / need rest'],'Not entered')}${select('us.energy-'+w,'My capacity for a conversation',['Not entered','Low','Some','Plenty'],'Not entered')}${field('us.weather-note-'+w,'What is contributing—and what do I need?')}</section>`).join('')}</div>${field('us.weather-bridge','One small way we can meet each other today')}<div class="toolbar">${btn('Save today’s check-in','save-weather','',true)}</div>${logs('us','Weather check-in')}`;
case 'discovery':return discovery();
case 'manuals':return heading('Our user manuals','Direct self-report, side by side. An empty answer is still unknown.')+`<p class="notice">These are editable preferences, not permanent promises. ${link('Edit Susanna’s manual','susanna','manual')} ${link('Edit Greg’s manual','greg','manual')}</p>${MANUAL.map(([k,l])=>`<section class="band"><h2>${esc(l)}</h2><div class="two-cols"><div><p class="compare-head">Susanna</p>${manualSnippet('susanna',k)}</div><div><p class="compare-head">Greg</p>${manualSnippet('greg',k)}</div></div></section>`).join('')}`;
case 'learned':return heading('Things we know from experience','Keep the real examples, including the moments that challenged the framework.')+`<div class="two-cols">${confirmedSummary()}</div><h2 class="band">Shared patterns you both confirmed</h2>${sharedConfirmed()}<h2 class="band">Our observations</h2>${field('us.new-observation','What did we learn about each other?')}<div class="toolbar">${btn('Save shared observation','save-observation','',true)}</div>${logs('us')}`;
}}
function sharedConfirmed(){const rows=Object.entries(COMPARE).filter(([k])=>{const id='compare-'+k.replace(/[^a-zA-Z]/g,'').toLowerCase();return ['susanna','greg'].every(w=>state.ratings[`us.${id}.${w}`]==='yes')});return rows.map(([k,d])=>`<article class="insight"><span class="evidence confirmed">Both confirmed · self-report</span><h3>${k}</h3><p>${d[2]}</p><p class="prompt">${d[3]}</p><a href="#us/compare">Review responses in Compare us</a></article>`).join('')||'<p class="empty">No comparison has a “Yes” from both of you yet.</p>';}
function discovery(){let inner='';if(discoveryStage===0)inner=`<label for="discovery-question">Choose a question</label><select id="discovery-question">${QUESTIONS.map((q,i)=>`<option value="${i}" ${i===discoveryQuestion?'selected':''}>${q}</option>`).join('')}</select><div class="toolbar">${btn('Start with Susanna','discovery-start','',true)}</div>`;else if(discoveryStage===1||discoveryStage===3){const who=discoveryStage===1?'Susanna':'Greg';inner=`<p class="eyebrow">${who}’s turn</p><p class="question">${QUESTIONS[discoveryQuestion]}</p><label for="discovery-answer">My answer</label><textarea id="discovery-answer" maxlength="10000" placeholder="Say it your way. You can also write ‘I’d rather skip this.’"></textarea><div class="toolbar">${btn(discoveryStage===1?'Hide my answer & pass to Greg':'Hide my answer & get ready to reveal','discovery-next','',true)}</div>`;}else if(discoveryStage===2)inner=`<div class="callout"><h2>Pass the device to Greg.</h2><p>Susanna’s answer is hidden from this view. Greg, answer the same question before you compare.</p>${btn('Greg: I’m ready','discovery-greg','',true)}</div>`;else if(discoveryStage===4)inner=`<div class="callout"><h2>Ready to see both?</h2><p>Bring the screen back between you. Curiosity first; no answer wins.</p>${btn('Reveal both answers','discovery-reveal','',true)}</div>`;else inner=`<p class="question">${QUESTIONS[discoveryQuestion]}</p><div class="two-cols">${['Susanna','Greg'].map((n,i)=>`<article class="callout"><h3>${n}</h3><p class="manual-answer">${esc(discoveryAnswers[i])}</p></article>`).join('')}</div><p class="prompt">What surprised you? What is one specific thing you can remember next time?</p><div class="toolbar">${btn('Save this discovery','discovery-save','',true)}${btn('Another question','discovery-reset')}</div>`;return heading('Learn something about each other','Answer separately. Reveal together. Replace a guess with a conversation.')+`<p class="notice">Pass-the-device mode hides answers during the handoff; it is not password-protected. Draft answers stay in memory only until you save the reveal. Saved discoveries are visible in this browser and included in backups.</p>${inner}${discoveryStage>0&&discoveryStage<5?`<div class="toolbar">${btn('Cancel this round','discovery-reset')}</div>`:''}`;}
function library(){switch(route.page){
case 'sources':return heading('Six books. Clear attribution.','Concise paraphrases from the supplied EPUBs support the framework. The personal portraits and interactive exercises are our synthesis.')+`<p class="notice">No book text, covers, or EPUB files are bundled. Locations below use chapter titles and EPUB document identifiers because reflowable books do not have stable page numbers. Metadata was checked inside the files; a filename’s date or author list can differ.</p>${SOURCES.map((s,i)=>`<article class="source-book" id="source-${s.id}"><p class="eyebrow">Source 0${i+1}</p><h2>${s.title}</h2><p>${s.author}<br><span class="muted">${s.year}</span></p><p>${s.summary}</p><details><summary>Where to find it in your EPUB</summary><p>${s.loc}</p><code>${s.files}</code></details></article>`).join('')}<section class="band"><h2>What changed from the earlier analysis?</h2><ul><li>The pursuit/withdrawal loop remains a hypothesis; Hall’s different 7–8 emotional pattern appears alongside it.</li><li>Secondary scores are reflective themes, not proof of a wing, instinct, attachment style, or stress state.</li><li>Greg’s low Two result is not treated as low empathy; Susanna’s low Six is not treated as absence of anxiety.</li><li>No compatibility percentage, diagnosis, or invented numerical chart has been added.</li><li>Daniels and Dion are the intimacy book’s authors; Siegel wrote the foreword. Discovering’s supplied EPUB carries a 2003 copyright despite its filename.</li></ul><p class="small muted">The prior conversation retrieval included the substantive Greg report and long Susanna/relationship excerpts; the latter two were truncated at the retrieval limit. This guide preserves the available analyses and requested architecture without pretending to reproduce missing endings.</p></section>`;
case 'theory':return heading('Use the framework lightly.','A language for reflection, with room for a person to be more complicated than a type.')+`<div class="evidence-grid"><article><h3>Source-backed theory</h3><p>“These authors describe this pattern.” It identifies the source of an idea; it does not establish scientific validity or prove it applies to you.</p></article><article><h3>Personalized inference</h3><p>“The earlier chart and report suggest this may fit.” It stays tentative unless you respond, and can be rejected without changing the underlying source summary.</p></article><article><h3>User-confirmed observation</h3><p>“This person says it fits.” A useful self-report, not a clinical finding. “Sometimes” is conditional. Shared confirmation requires both people to answer Yes.</p></article></div><section class="band"><h2>Motivation before stereotype</h2><p>Riso and Hudson describe Seven in relation to satisfaction and aversion to deprivation or pain, and Eight in relation to autonomy and protection from violation. Similar behavior can come from different motives; a moment of silence or enthusiasm cannot type a person.</p>${src('wisdom')}</section><section class="band"><h2>Wings, secondary patterns, and instincts</h2><p>In these sources, a wing is adjacent to the core: Seven’s neighbors are Six and Eight; Eight’s are Seven and Nine. Greg’s Five theme is not a wing. The committee borrows the idea that all nine functions can be reflected in a person, but it is a metaphor, not a diagnostic instrument.</p><p>The guide does not infer self-preservation, social, or sexual/one-to-one instinct priorities. It does not infer attachment styles or development levels from charts.</p>${src('discovering')} · ${src('love')}</section><section class="band"><h2>Stress and growth are not a score decoder</h2><p>Riso and Hudson’s model associates Seven’s stress direction with One and growth direction with Five; Eight’s with Five and Two respectively. Those are framework claims—not reasons to diagnose a current state from a high secondary score. Here, the practical emphasis is presence and discernment for Seven, and receptive, generous strength for Eight.</p>${src('discovering')} · ${src('understanding')}</section><section class="band"><h2>Relationship quality is not type arithmetic</h2><p>A pairing can suggest questions, not predict your future. Daniels and Dion center presence, communication, self-connection, and mutuality. Preferences about affection, intimacy, support, and boundaries must be supplied by the people involved.</p>${src('intimacy')}</section><section class="band"><h2>The chart’s limits</h2><p>The guide retains the earlier qualitative rankings and the reported Caretaking result, 19/20. The original numerical type scores and assessment instrument have not been established here. The circle never implies measured distances or scores.</p><p>This is a self-reflection tool, not a psychological diagnosis or a validated compatibility test.</p></section>`;
case 'data':return heading('Your notes stay with you.','No account. No backend. No external scripts, fonts, analytics, or network requests.')+`<div class="callout"><h2>${storageOK?'Saving on this device':'Session-only mode'}</h2><p>${storageOK?'Responses and writing are saved automatically in this browser’s localStorage.':esc(loadProblem)}</p><p>Data does not sync across devices, browsers, or site addresses. Opening the file locally and opening it on GitHub Pages may use different storage. Browser cleanup can erase saved work; export a backup regularly.</p></div><div class="band"><h2>Backup and move your personalization</h2><p>Exports include both manuals, responses, drafts, and saved observations. Treat the JSON as personal information. The HTML remains the original guide; exporting does not embed your notes into it.</p><div class="toolbar">${btn('Export backup (.json)','export','',true)}${btn('Download our observations (.txt)','export-notes')}${!storageOK?btn('Export original stored data','raw-export'):''}</div><label for="import-file">Restore a previously exported S + G backup</label><input type="file" id="import-file" accept=".json,application/json"><p class="small muted">The file is checked first. You’ll see a summary before choosing to replace this browser’s current personalization.</p><div id="import-preview" aria-live="polite"></div><details><summary>Copy or paste a backup instead</summary><p class="small muted">If this browser restricts downloads or file selection, show the backup text and copy it into a text file. Paste that JSON below to restore it later.</p><div class="toolbar">${btn('Show backup text','backup-text')}</div><label for="backup-text">Copyable backup (select all and copy)</label><textarea id="backup-text" readonly rows="6"></textarea><label for="restore-text">Paste a backup to validate</label><textarea id="restore-text" rows="6" spellcheck="false"></textarea><div class="toolbar">${btn('Check pasted backup','check-backup-text')}</div><div id="paste-preview" aria-live="polite"></div></details></div><div class="band"><h2>Publishing on GitHub Pages</h2><p>Upload this file as <code>index.html</code> to your Pages site’s publishing folder. There is no build step and no backend. The published page includes the names and personalized analyses already in this file. Local notes are not published unless you separately share a backup.</p><p class="small muted">Local storage is not encrypted or password-protected. Anyone using this browser profile can view the saved notes.</p></div><details class="band"><summary>Reset personalization on this device</summary><p>This removes responses, writing, and saved observations for this guide only. Export first if you want to keep them.</p><label class="inline-check"><input type="checkbox" id="reset-confirm"> I want to clear this guide’s local personalization.</label><div class="toolbar">${btn('Reset this guide','reset')}</div></details>`;
}}
function logs(person,kind){const ls=state.logs.filter(l=>l.person===person&&(!kind||l.kind===kind)).slice().reverse();return ls.length?ls.map(l=>`<article class="log"><time datetime="${esc(l.date)}">${new Date(l.date).toLocaleString()}</time><h3>${esc(l.kind)}</h3><p>${esc(l.text)}</p><button data-delete="${esc(l.id)}">Delete entry</button></article>`).join(''):'<p class="empty">No saved moments yet.</p>';}
function addLog(person,kind,text){if(!text.trim()){toast('Write a little context before saving.');return false;}if(text.length>30000){toast('This entry is too long. Shorten it to 30,000 characters before saving; your draft is still here.');return false;}if(state.logs.length>=500){toast('Your journal has 500 entries. Export a backup and remove older entries before adding more.');return false;}state.logs.push({id:Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8),date:new Date().toISOString(),person,kind,text});save();toast(storageOK?'Saved to your observations.':'Added for this session. Export a backup to keep it.');return true;}
function collected(keys){return keys.map(([k,l])=>val(k)?l+': '+val(k):'').filter(Boolean).join('\n\n');}
function download(name,text,type){const b=new Blob([text],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);}
function manualText(w){return 'HOW TO '+PEOPLE[w].name.toUpperCase()+'\nSelf-reported preferences · '+new Date().toLocaleDateString()+'\n\n'+MANUAL.map(([k,l])=>l+'\n'+(val(w+'.manual.'+k)||'[Not yet answered]')).join('\n\n');}
function repairText(){return collected([['us.conflict-s','Susanna feels'],['us.conflict-g','Greg feels'],['us.conflict-sneed','Susanna asks'],['us.conflict-gneed','Greg asks'],['us.conflict-reassurance','What we can honestly say'],['us.conflict-return','Check back'],['us.conflict-next','Next action']]);}
let pendingImport=null,lastDeleted=null;
function previewBackup(text,target){pendingImport=null;try{pendingImport=validate(JSON.parse(text));$(target).innerHTML=`<div class="status-box"><p>Valid backup: ${Object.keys(pendingImport.ratings).length} responses, ${Object.keys(pendingImport.fields).length} written fields, ${pendingImport.logs.length} saved entries.</p><p>Restoring replaces current personalization. Export your current data first if needed.</p><div class="toolbar">${btn('Replace with this backup','import-apply','',true)}${btn('Cancel restore','import-cancel')}</div></div>`;}catch(err){$(target).textContent='Could not restore: '+err.message;}}

document.addEventListener('input',e=>{const k=e.target.dataset.field;if(k){state.fields[k]=e.target.value;save();}});
document.addEventListener('change',async e=>{const k=e.target.dataset.field;if(k){state.fields[k]=e.target.value;save();if(['us.translate-who','us.help-who'].includes(k)){if(k==='us.translate-who')state.fields['us.translate-index']='0';render();document.getElementById('f-'+k)?.focus();}if(k==='susanna.stay-kind')$('#stay-questions').innerHTML=stayQuestions();}
 if(e.target.id==='pattern'){selectedPattern=Number(e.target.value);render();$('#pattern').focus();}
 if(e.target.id==='compare'){selectedCompare=e.target.value;render();$('#compare').focus();}
 if(e.target.id==='translation'){state.fields['us.translate-index']=e.target.value;save();render();$('#translation').focus();}
 if(e.target.id==='discovery-question')discoveryQuestion=Number(e.target.value);
 if(e.target.id==='import-file'){pendingImport=null;const f=e.target.files[0];if(!f)return;try{if(f.size>100000000)throw Error('Backup is too large (maximum 100 MB).');if($('#paste-preview'))$('#paste-preview').innerHTML='';pendingImport=validate(JSON.parse(await f.text()));$('#import-preview').innerHTML=`<div class="status-box"><p>Valid backup: ${Object.keys(pendingImport.ratings).length} responses, ${Object.keys(pendingImport.fields).length} written fields, ${pendingImport.logs.length} saved entries.</p><p>Restoring replaces current personalization. Export your current data first if needed.</p><div class="toolbar">${btn('Replace with this backup','import-apply','',true)}${btn('Cancel restore','import-cancel')}</div></div>`;}catch(err){$('#import-preview').textContent='Could not restore: '+err.message;}}
});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.rate){const y=window.scrollY;state.ratings[b.dataset.rate]=b.dataset.value;save();const k=b.dataset.rate,v=b.dataset.value;render();window.scrollTo(0,y);document.querySelector(`[data-rate="${CSS.escape(k)}"][data-value="${v}"]`)?.focus({preventScroll:true});toast(v==='no'?'Marked Nope. Excluded from confirmed summaries.':v==='sometimes'?'Marked Sometimes. Kept as conditional.':'Recorded as a self-report.');return;}
 if(b.dataset.clear){const y=scrollY;delete state.ratings[b.dataset.clear];save();render();scrollTo(0,y);toast('Response cleared. This is a hypothesis again.');return;}
 if(b.dataset.type){selectedType=Number(b.dataset.type);const y=scrollY;render();scrollTo(0,y);document.querySelector(`[data-type="${selectedType}"]`)?.focus({preventScroll:true});return;}
 if(b.dataset.driver){state.fields[route.person+'.driver']=b.dataset.driver;save();const y=scrollY;render();scrollTo(0,y);document.querySelector(`[data-driver="${b.dataset.driver}"]`)?.focus({preventScroll:true});toast('Noted as today’s observation.');return;}
 if(b.dataset.filter){state.fields[route.person+'.report-filter']=b.dataset.filter;save();render();document.querySelector(`[data-filter="${CSS.escape(b.dataset.filter)}"]`)?.focus();return;}
 if(b.dataset.loop){selectedLoop=Number(b.dataset.loop);const y=scrollY;render();scrollTo(0,y);document.querySelector(`[data-loop="${selectedLoop}"]`)?.focus({preventScroll:true});return;}
 if(b.dataset.delete){lastDeleted=state.logs.find(l=>l.id===b.dataset.delete);state.logs=state.logs.filter(l=>l.id!==b.dataset.delete);save();const y=scrollY;render();scrollTo(0,y);$('#toast').innerHTML='Entry deleted. '+btn('Undo','undo-delete');clearTimeout(toastTimer);return;}
 const a=b.dataset.action,w=route.person;
 if(a==='print'){window.print();return;}
 if(a==='save-pattern'){const d=PATTERNS[w][selectedPattern],key=w+'.pattern-observation.'+selectedPattern;if(!val(key).trim()){toast('Write what happened before saving this observation.');return;}addLog(w,'Pattern observation',d[0]+'\n\n'+val(key));return;}
 if(a==='save-observation'){if(addLog(w,w==='us'?'Shared observation':'Personal observation',val(w+'.new-observation'))){state.fields[w+'.new-observation']='';save();render();}return;}
 if(a==='save-stay'){if(!val('susanna.stay-action').trim()){toast('Add your next action or reason for leaving.');return;}if(addLog('susanna','Stay choice',collected([['susanna.stay-kind','Situation'],['susanna.stay-context','Context'],['susanna.stay-need','What matters'],['susanna.stay-choice','Choice'],['susanna.stay-action','Next action / reason'],['susanna.stay-return','Revisit']]))){render();}return;}
 if(a==='autonomy-statement'){const need=val('greg.auto-need')||'Time',boundary=val('greg.auto-boundary'),back=val('greg.auto-return');if(!boundary||!back){toast('Name a boundary and a check-in time first.');return;}$('#autonomy-result').innerHTML=`<div class="result">${esc('I need '+need.toLowerCase()+'. '+boundary+'\n\n'+(val('greg.auto-connection')||'I want to come back to this when I can be present.')+'\n\nI can check back '+back+'.')}</div>`;return;}
 if(a==='save-autonomy'){if(!val('greg.auto-trigger')&&!val('greg.auto-boundary')){toast('Add a situation or boundary first.');return;}if(addLog('greg','Autonomy check',collected([['greg.auto-trigger','What happened'],['greg.auto-need','Need'],['greg.auto-boundary','Boundary'],['greg.auto-connection','Connection'],['greg.auto-return','Check back']]))){render();}return;}
 if(a==='save-translation'){if(!val('us.translation-observation').trim()){toast('Write what your partner said, rather than saving a guess.');return;}const who=val('us.translate-who')||'Greg';addLog('us','Things we misread',who+' · '+TRANSLATIONS[who.toLowerCase()][Number(val('us.translate-index')||0)][0]+'\n\n'+val('us.translation-observation'));return;}
 if(a==='repair-note'||a==='save-conflict'){const t=repairText();if(!val('us.conflict-next')||!val('us.conflict-return')){toast('Choose a next action and a check-in time first.');return;}if(a==='repair-note')$('#repair-result').innerHTML=`<div class="result">${esc(t)}</div>`;else if(addLog('us','Repair agreement',t))render();return;}
 if(a==='help-request'||a==='save-help'){const who=val('us.help-who')||'Susanna',kind=val('us.help-kind')||'Listen without fixing';if(!val('us.help-specific')){toast('Add a specific request or limit first.');return;}const t=who+' is asking for: '+kind.toLowerCase()+'.\n\n'+val('us.help-specific')+(val('us.help-time')?'\n\nTiming: '+val('us.help-time'):'')+'\n\nDo you have capacity for that?';if(a==='help-request')$('#help-result').innerHTML=`<div class="result">${esc(t)}</div>`;else addLog('us','Support request',t);return;}
 if(a==='save-decision'){if(!val('us.decision-choice')){toast('Write your choice before saving the decision.');return;}if(addLog('us','Decision',collected([['us.decision-topic','Question'],['us.decision-criteria','Shared criteria'],['us.decision-owner','Owner and timing'],['us.decision-options','Options'],['us.decision-risks','Tradeoffs'],['us.decision-missing','Missing information'],['us.decision-choice','Choice'],['us.decision-next','Next action'],['us.decision-review','Review']]))){render();}return;}
 if(a==='save-weather'){const all=collected([['us.weather-susanna','Susanna’s weather'],['us.energy-susanna','Susanna’s capacity'],['us.weather-note-susanna','Susanna says'],['us.weather-greg','Greg’s weather'],['us.energy-greg','Greg’s capacity'],['us.weather-note-greg','Greg says'],['us.weather-bridge','Our bridge']]);if(!all||!['susanna','greg'].some(w=>val('us.weather-'+w)&&val('us.weather-'+w)!=='Not entered')){toast('Enter at least one person’s weather first.');return;}if(addLog('us','Weather check-in',all))render();return;}
 if(a==='discovery-start'){discoveryStage=1;render();$('#discovery-answer').focus();return;}
 if(a==='discovery-next'){const t=$('#discovery-answer').value.trim();if(!t){toast('Write an answer, or say you’d prefer to skip.');return;}discoveryAnswers[discoveryStage===1?0:1]=t;discoveryStage++;render();$('#main').focus();return;}
 if(a==='discovery-greg'){discoveryStage=3;render();$('#discovery-answer').focus();return;}
 if(a==='discovery-reveal'){discoveryStage=5;render();$('#main').focus();return;}
 if(a==='discovery-save'){if(addLog('us','Discovery',QUESTIONS[discoveryQuestion]+'\n\nSusanna: '+discoveryAnswers[0]+'\n\nGreg: '+discoveryAnswers[1])){b.disabled=true;b.textContent='Saved to what we’ve learned';}return;}
 if(a==='discovery-reset'){discoveryStage=0;discoveryAnswers=['',''];render();$('#main').focus();return;}
 if(a==='backup-text'){$('#backup-text').value=JSON.stringify(state,null,2);$('#backup-text').focus();$('#backup-text').select();toast('Backup text is ready to copy.');return;}
 if(a==='check-backup-text'){$('#import-preview').innerHTML='';previewBackup($('#restore-text').value,'#paste-preview');return;}
 if(a==='export'){download('sg-field-guide-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(state,null,2),'application/json');toast('Backup download prepared.');return;}
 if(a==='export-manual'){download(w+'-user-manual.txt',manualText(w),'text/plain');return;}
 if(a==='export-notes'){const text=manualText('susanna')+'\n\n'+manualText('greg')+'\n\nOBSERVATIONS\n\n'+state.logs.map(l=>l.date+' · '+l.person+' · '+l.kind+'\n'+l.text).join('\n\n---\n\n');download('sg-observations.txt',text,'text/plain');return;}
 if(a==='raw-export'){try{download('sg-original-stored-data.txt',localStorage.getItem(KEY)||'No stored data found.','text/plain');}catch(err){toast('Original storage is inaccessible. Export the current session instead.');}return;}
 if(a==='import-apply'&&pendingImport){state=pendingImport;pendingImport=null;save();render();toast(storageOK?'Backup restored.':'Backup loaded for this session. Export before closing.');return;}
 if(a==='import-cancel'){pendingImport=null;$('#import-preview').innerHTML='Restore canceled.';if($('#paste-preview'))$('#paste-preview').innerHTML='';$('#import-file').value='';return;}
 if(a==='reset'){if(!$('#reset-confirm').checked){toast('Check the reset box to confirm clearing this guide’s data.');return;}try{localStorage.removeItem(KEY);storageOK=true;loadProblem='';}catch(err){storageOK=false;}state=blank();discoveryAnswers=['',''];discoveryStage=0;lastDeleted=null;pendingImport=null;save();render();toast('Personalization cleared for this guide.');return;}
 if(a==='undo-delete'&&lastDeleted){state.logs.push(lastDeleted);state.logs.sort((a,b)=>a.date.localeCompare(b.date));lastDeleted=null;save();render();toast('Entry restored.');return;}
});
